[project]
name = "getenvelope"
version = "0.0.0"
description = "GetEnvelope application workspace"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["backend"]

[tool.uv.sources]
getenvelope-backend = { workspace = true }

[dependency-groups]
dev = [
    "getenvelope-backend",
    "mypy>=1.15,<3",
    "ruff>=0.12,<1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC2"]

[tool.mypy]
python_version = "3.12"
files = ["backend/src"]
strict = true
