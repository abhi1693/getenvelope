[project]
name = "getenvelope-backend"
version = "0.0.1"
description = "GetEnvelope FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.161.0,<1",
    "uvicorn[standard]>=0.54.0,<1",
]

[build-system]
requires = ["setuptools>=84.2.1,<85"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
